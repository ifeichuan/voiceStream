[package]
name = "voicestream"
version = "1.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voicestream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
futures-util = "0.3"
http = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tauri-plugin-global-shortcut = "2"
portable-pty = "0.9.0"
base64 = "0.22"
url = "2"
native-tls = "0.2"
tokio-native-tls = "0.3"
core-graphics = { version = "0.25.0", features = ["default"] }
arboard = "3.6.1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSControl", "NSFont", "NSGlassEffectView", "NSGraphics", "NSPanel", "NSParagraphStyle", "NSScreen", "NSText", "NSTextField", "NSView", "NSWindow", "objc2-core-graphics", "objc2-quartz-core"] }

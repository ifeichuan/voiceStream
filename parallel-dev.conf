# parallel-dev.conf - VoiceStream parallel development environments
#
# Usage:
#   bash ~/.agents/skills/parallel-dev/scripts/parallel-dev.sh build
#   bash ~/.agents/skills/parallel-dev/scripts/parallel-dev.sh create ui-dashboard main
#   PARALLEL_PROFILE=host-panel bash ~/.agents/skills/parallel-dev/scripts/parallel-dev.sh create quick-ui main
#   PARALLEL_PROFILE=tauri bash ~/.agents/skills/parallel-dev/scripts/parallel-dev.sh create native-hotkey main

PROJECT_NAME="voicestream"

# Panel dev server / Tauri devUrl port.
PORT_APP_RANGE="1420:1460"

BUILD_CMD='docker compose -f "${REPO_ROOT}/docker-compose.parallel.yml" build'
BUILD_CHECK_CMD=""

SETUP_CMD='
  cd "$WORKTREE_PATH"
  case "${PARALLEL_PROFILE:-docker-panel}" in
    docker-panel|panel)
      cat > pnpm-workspace.yaml <<YAML
packages:
  - .

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
YAML
      ;;
    host-panel|tauri)
      cat > pnpm-workspace.yaml <<YAML
packages:
  - .

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
YAML
      pnpm install --frozen-lockfile
      ;;
    *)
      echo "Unknown PARALLEL_PROFILE=${PARALLEL_PROFILE}" >&2
      exit 1
      ;;
  esac
'

START_CMD='
  cd "$WORKTREE_PATH"
  COMPOSE_NAME="${PROJECT_NAME}-${ENV_NAME}"

  case "${PARALLEL_PROFILE:-docker-panel}" in
    docker-panel|panel)
      COMPOSE_PROJECT_NAME="${COMPOSE_NAME}" \
      APP_SOURCE="${WORKTREE_PATH}" \
      PORT_APP="${PORT_APP}" \
        docker compose -p "${COMPOSE_NAME}" \
        -f "${REPO_ROOT}/docker-compose.parallel.yml" up -d --build
      ;;

    host-panel)
      VOICESTREAM_DEV_PORT="${PORT_APP}" \
        pnpm dev --host 127.0.0.1 --port "${PORT_APP}" --strictPort \
        > .agent-vite.log 2>&1 &
      echo $! > .agent-vite.pid
      ;;

    tauri)
      SAFE_ENV=$(printf "%s" "$ENV_NAME" | tr "[:upper:]" "[:lower:]" | tr -cd "a-z0-9")
      [ -n "$SAFE_ENV" ] || SAFE_ENV="dev"

      cat > .tauri.parallel.json <<JSON
{
  "productName": "voicestream-${SAFE_ENV}",
  "identifier": "com.feichuans.voicestream.${SAFE_ENV}",
  "build": {
    "beforeDevCommand": "VOICESTREAM_DEV_PORT=${PORT_APP} pnpm dev --host 127.0.0.1 --port ${PORT_APP} --strictPort",
    "devUrl": "http://localhost:${PORT_APP}"
  }
}
JSON

      VOICESTREAM_DEV_PORT="${PORT_APP}" \
      VOICESTREAM_DISABLE_GLOBAL_SHORTCUTS="${VOICESTREAM_DISABLE_GLOBAL_SHORTCUTS:-1}" \
        pnpm tauri dev --config .tauri.parallel.json \
        > .agent-tauri.log 2>&1 &
      echo $! > .agent-tauri.pid
      ;;

    *)
      echo "Unknown PARALLEL_PROFILE=${PARALLEL_PROFILE}" >&2
      exit 1
      ;;
  esac
'

STOP_CMD='
  COMPOSE_NAME="${PROJECT_NAME}-${ENV_NAME}"

  COMPOSE_PROJECT_NAME="${COMPOSE_NAME}" \
    APP_SOURCE="${WORKTREE_PATH}" \
    docker compose -p "${COMPOSE_NAME}" \
    -f "${REPO_ROOT}/docker-compose.parallel.yml" down -v --remove-orphans 2>/dev/null || true

  for file in "$WORKTREE_PATH/.agent-vite.pid" "$WORKTREE_PATH/.agent-tauri.pid"; do
    if [ -f "$file" ]; then
      kill "$(cat "$file")" 2>/dev/null || true
      rm -f "$file"
    fi
  done

  kill $(lsof -ti tcp:${PORT_APP}) 2>/dev/null || true
'

STATUS_CMD='
  COMPOSE_NAME="${PROJECT_NAME}-${ENV_NAME}"
  APP_SOURCE="${WORKTREE_PATH}" docker compose -p "${COMPOSE_NAME}" \
    -f "${REPO_ROOT}/docker-compose.parallel.yml" ps --status running --services 2>/dev/null |
    grep -q . ||
  lsof -ti tcp:${PORT_APP} 2>/dev/null
'
